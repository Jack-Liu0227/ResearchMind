# Redis Configuration for ResearchMind
# Optimized for session and history storage

# Network
bind 0.0.0.0
port 6379
protected-mode no
stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb
# Windows 本机运行可改为本地目录（Docker 请保持 /data 并通过 -v 映射）
dir /data

# AOF (Append Only File) for better durability
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# Memory Management
maxmemory 256mb
maxmemory-policy allkeys-lru

# Logging
loglevel notice
logfile ""

# Client Timeout
timeout 300

# TCP keepalive
tcp-keepalive 300

# Performance
tcp-backlog 511
databases 16
