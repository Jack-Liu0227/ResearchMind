# ResearchMind Nginx 反向代理配置 (Windows 版本)
# 通过统一的 50001 端口访问所有服务
#
# 使用方法：
# 1. 下载 Nginx for Windows（http://nginx.org/en/download.html）
# 2. 解压到 C:\nginx-x.y.z 或任意目录
# 3. 将本文件内容复制到 <Nginx 解压目录>\conf\nginx.conf
# 4. 在 PowerShell 或 CMD 中进入 Nginx 目录
# 5. 测试配置：nginx -t
# 6. 启动：start nginx
# 7. 热重载：nginx -s reload
# 8. 停止：nginx -s quit（优雅）或 nginx -s stop（强制）
#
# 如需开机自启，可配合 nssm 等工具注册为 Windows 服务。

# 可按 CPU 核心数调整
worker_processes  1;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    # ==============================
    # 上游服务定义
    # ==============================
    upstream frontend {
        server 127.0.0.1:50010;  # Vite 前端开发服务器
    }

    upstream backend_api {
        server 127.0.0.1:50002;  # FastAPI HTTP API
    }

    upstream websocket {
        server 127.0.0.1:50003;  # WebSocket 服务器
    }

    server {
        listen       50001 default_server;
        listen       [::]:50001 default_server;
        server_name  _;

        client_max_body_size 100M;

        # Windows 下建议使用相对路径，日志存放在 <Nginx 根>\logs\
        access_log logs/researchmind_access.log;
        error_log  logs/researchmind_error.log;

        # ------------------------------
        # 前端页面与静态资源
        # ------------------------------
        location / {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $server_name;
            proxy_set_header X-Forwarded-Port $server_port;

            # 允许前端 HMR/WebSocket 透传
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # ------------------------------
        # 后端 HTTP API
        # ------------------------------
        location /api/ {
            proxy_pass http://backend_api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $server_name;
            proxy_set_header X-Forwarded-Port $server_port;

            proxy_connect_timeout 60s;
            proxy_send_timeout    300s;
            proxy_read_timeout    300s;
        }

        # ------------------------------
        # WebSocket 代理
        # ------------------------------
        location /ws/ {
            proxy_pass http://websocket/;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $server_name;
            proxy_set_header X-Forwarded-Port $server_port;

            proxy_connect_timeout 7d;
            proxy_send_timeout    7d;
            proxy_read_timeout    7d;
        }

        # ------------------------------
        # 健康检查（可选）
        # ------------------------------
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
    }
}
