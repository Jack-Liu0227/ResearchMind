# ResearchMind Nginx 反向代理配置
# 用于统一通过 50001 端口访问所有服务
# 
# 使用方法：
# 1. 安装 Nginx：apt-get install nginx
# 2. 复制此文件到 /etc/nginx/sites-available/researchmind
# 3. 创建符号链接：ln -s /etc/nginx/sites-available/researchmind /etc/nginx/sites-enabled/
# 4. 删除默认配置：rm /etc/nginx/sites-enabled/default
# 5. 测试配置：nginx -t
# 6. 启动 Nginx：systemctl start nginx
# 7. 重新加载配置：systemctl reload nginx

# 定义上游服务器
upstream frontend {
    server 127.0.0.1:50001;
}

upstream backend_api {
    server 127.0.0.1:50002;
}

upstream websocket {
    server 127.0.0.1:50003;
}

# HTTP 服务器配置
server {
    listen 50001 default_server;
    listen [::]:50001 default_server;
    
    # 使用 _ 作为 server_name，接受所有请求（包括 IP 地址和任何域名）
    server_name _;
    
    # 增加请求体大小限制（用于上传文件）
    client_max_body_size 100M;
    
    # 日志配置
    access_log /var/log/nginx/researchmind_access.log;
    error_log /var/log/nginx/researchmind_error.log;

    # ==========================================
    # 前端静态文件和根路径
    # ==========================================
    location / {
        proxy_pass http://frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $server_name;
        proxy_set_header X-Forwarded-Port $server_port;
        
        # 支持 WebSocket 升级（如果前端需要）
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # ==========================================
    # 后端 API 路由
    # ==========================================
    location /api/ {
        proxy_pass http://backend_api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $server_name;
        proxy_set_header X-Forwarded-Port $server_port;
        
        # 增加超时时间（用于长时间运行的 API 请求）
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # ==========================================
    # WebSocket 路由
    # ==========================================
    location /ws/ {
        proxy_pass http://websocket/;
        
        # WebSocket 必需的头部
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # 代理头部
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $server_name;
        proxy_set_header X-Forwarded-Port $server_port;
        
        # WebSocket 超时配置
        proxy_connect_timeout 7d;
        proxy_send_timeout 7d;
        proxy_read_timeout 7d;
    }

    # ==========================================
    # 健康检查端点（可选）
    # ==========================================
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}

