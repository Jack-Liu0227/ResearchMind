# Nginx configuration for ResearchMind
# This file configures Nginx to act as a reverse proxy for UI and HTTP API on port 50001
# Supports: Linux, macOS, Windows

# Note: 'user' directive is not supported on Windows, so it's commented out
# On Linux/macOS, uncomment the line below if needed
# user nginx;

worker_processes auto;

# Platform-specific logging paths
# Linux/macOS: /var/log/nginx/error.log
# Windows: logs/error.log (relative to nginx installation directory)
error_log logs/error.log warn;
pid logs/nginx.pid;

events {
    worker_connections 1024;
}

http {
    # Platform-specific mime.types path
    # Try multiple locations for compatibility
    include mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log logs/access.log main;

    # Temporary directories for Nginx (relative paths for cross-platform support)
    client_body_temp_path temp/client_body_temp;
    proxy_temp_path temp/proxy_temp;
    fastcgi_temp_path temp/fastcgi_temp;
    uwsgi_temp_path temp/uwsgi_temp;
    scgi_temp_path temp/scgi_temp;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 100M;

    # Upstream servers
    upstream ui_server {
        server 127.0.0.1:8001;
    }

    upstream api_server {
        server 127.0.0.1:8000;
    }

    # Main server block
    server {
        listen 50001;
        server_name dyum1393797.bohrium.tech;

        # Logging
        access_log /var/log/nginx/researchmind_access.log main;
        error_log /var/log/nginx/researchmind_error.log warn;

        # API routes - proxy to HTTP API server
        location /api/ {
            proxy_pass http://api_server;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $server_name;
            proxy_set_header X-Forwarded-Port $server_port;

            # 关键修复：禁用请求体缓冲，确保上传的CIF内容完整转发
            proxy_request_buffering off;

            # 关键修复：禁用响应体缓冲，确保响应流式传输
            proxy_buffering off;

            # 关键修复：设置缓冲大小，防止大文件被截断
            proxy_buffer_size 128k;
            proxy_buffers 256 16k;
            proxy_busy_buffers_size 256k;

            # Timeouts for file uploads/downloads
            proxy_connect_timeout 60s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
        }

        # Health check endpoint
        location /health {
            proxy_pass http://api_server;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Docs endpoint
        location /docs {
            proxy_pass http://api_server;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # OpenAPI schema
        location /openapi.json {
            proxy_pass http://api_server;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # UI routes - proxy to UI server
        location / {
            proxy_pass http://ui_server;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # WebSocket support for Vite HMR
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            
            # Timeouts
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }
    }
}

