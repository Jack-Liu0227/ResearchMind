[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
index-url = "https://pypi.org/simple"
extra-index-url = ["https://download.pytorch.org/whl/cu124"]

[tool.hatch.build.targets.wheel]
packages = ["agents", "mcp_servers", "communication"]

[project]
name = "researchmind"
version = "0.1.0"
description = "AI-Powered Research Assistant with Multi-Agent System"
authors = [
    {name = "ResearchMind Team"},
]
dependencies = [
    # Web framework and API
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "websockets>=12.0",
    # AI/LLM integrations
    "openai>=1.3.0", # Compatible with DeepSeek API
    "anthropic>=0.7.0", # Optional alternative
    "litellm>=1.0.0", # LLM integration library
    # Google ADK (Agent Development Kit)
    "google-adk>=1.15.0",
    "google-generativeai>=0.3.0",
    "google-auth>=2.23.0",
    "google-auth-oauthlib>=1.1.0",
    # MCP (Model Context Protocol)
    "mcp>=1.0.0",
    "fastmcp>=0.1.0",
    # HTTP requests and APIs
    "httpx[socks]>=0.25.0",
    "requests>=2.32.3",
    "aiohttp>=3.9.0",
    # Data processing and analysis
    "pandas>=2.1.0",
    "numpy>=1.25.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    # Chemistry and materials science
    "rdkit>=2023.9.1",
    "ase>=3.22.0",
    "pymatgen>=2023.10.0",
    # Machine learning and deep learning
    "scikit-learn>=1.3.0",
    "torch==2.6.0+cu124",
    "torchvision==0.21.0+cu124",
    "torchaudio==2.6.0+cu124",
    # Database and storage
    "sqlalchemy>=2.0.0",
    "alembic>=1.12.0",
    "redis>=5.0.0",
    # Authentication and security
    "python-jose[cryptography]>=3.3.0",  # JWT Token
    "passlib[bcrypt]>=1.7.4",  # Password hashing
    # Utilities
    "python-dotenv>=1.0.0",
    "pydantic>=2.4.0",
    "pydantic-settings>=2.0.0",
    "python-multipart>=0.0.6",
    "omegaconf>=2.3.0", # Required by CrystaLLM
    # Logging and monitoring
    "structlog>=23.1.0",
    "rich>=13.6.0",
    # ArXiv API for paper search
    "arxiv>=1.4.0",
    "feedparser>=6.0.0",
    # PDF processing
    "PyPDF2>=3.0.0",
    "pypdf>=3.0.0",
    # Excel processing
    "openpyxl>=3.1.0",
    # Testing (optional, will be in dev group)
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "mp-api==0.45.9",
    "aflow==0.0.11",
    "langchain-tavily==0.2.11",
    "qmpy-rester==0.2.0",
    "chromadb>=1.1.0",
    "scholarly>=1.7.11",
    "beautifulsoup4>=4.14.2",
    "tavily-python>=0.7.12",
    "mattersim>=1.2.0",
]

requires-python = ">=3.10"
readme = "README.md"
license = {text = "MIT"}
keywords = ["ai", "research", "agents", "materials-science", "literature-review"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics",
]

[project.optional-dependencies]
dev = [
    # Development tools
    "black>=23.9.0",
    "isort>=5.12.0",
    "flake8>=6.1.0",
    "mypy>=1.6.0",
    "pre-commit>=3.4.0",
    
    # Testing
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.11.0",
    "httpx>=0.25.0",  # for testing FastAPI
    
    # Documentation
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.4.0",
    "mkdocstrings[python]>=0.23.0",
]

simulation = [
    # Extended simulation capabilities
    "qiskit>=0.44.0",  # Quantum simulation
    "openmm>=8.0.0",   # Molecular dynamics
    "cclib>=1.7.0",    # Computational chemistry parsing
]

[project.urls]
Homepage = "https://github.com/your-username/ResearchMind"
Documentation = "https://researchmind.readthedocs.io"
Repository = "https://github.com/your-username/ResearchMind.git"
"Bug Tracker" = "https://github.com/your-username/ResearchMind/issues"

[project.scripts]
research-server = "communication.api_server:main"

[tool.black]
line-length = 88
target-version = ['py310']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88
known_first_party = ["researchmind", "agents", "mcp_servers", "communication"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = [
    "rdkit.*",
    "ase.*",
    "pymatgen.*",
    "mcp.*",
    "fastmcp.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--verbose",
    "--tb=short",
    "--cov=researchmind",
    "--cov=agents",
    "--cov=mcp_servers",
    "--cov=communication",
    "--cov-report=term-missing",
    "--cov-report=html",
]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["researchmind", "agents", "mcp_servers", "communication"]
omit = [
    "*/tests/*",
    "*/test_*",
    "*/__pycache__/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
